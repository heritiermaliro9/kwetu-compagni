<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Paramètres WhatsApp | Administration KWETU</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js" defer></script><script src="settings.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a class="site-logo" href="../index.html"><span>KWETU <em>COMPANY</em></span></a><div class="admin-actions"><a href="dashboard.html">Produits</a><a href="articles.html">Actualités</a><button id="logout-button" class="btn-plain" type="button">Déconnexion</button></div></div></header><main class="section"><div class="container admin-dashboard"><p class="eyebrow">Paramètres de contact</p><h1>WhatsApp de commande.</h1><p class="section-text admin-intro">Ce numéro est utilisé dans les boutons « Commander » et dans le formulaire de contact.</p><section class="admin-card"><div class="admin-card-head"><h2>Numéro WhatsApp</h2><p>Indiquez le numéro international, sans le signe + ni espaces.</p></div><form id="settings-form" class="admin-form"><label for="whatsapp-number">Numéro à contacter</label><input id="whatsapp-number" name="whatsappNumber" inputmode="numeric" maxlength="15" placeholder="Ex : 24370902655" required><small>Entre 8 et 15 chiffres. Exemple RDC : 24370902655.</small><button id="settings-save" type="submit">Enregistrer le numéro</button><p id="settings-message" class="form-message" role="status" aria-live="polite"></p></form></section></div></main></body></html>
