<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produits | KWETU COMPANY</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a class="site-logo" href="index.html"><img src="css/images/logo.png" alt=""><span>KWETU <em>COMPANY</em></span></a><nav class="site-nav"><ul><li><a href="index.html">Accueil</a></li><li><a class="active" href="produits.html">Produits</a></li><li><a href="services.html">Services</a></li><li><a href="articles.html">Actualités</a></li><li><a href="contact.html">Contact</a></li></ul></nav><button class="theme-toggle" type="button">◐</button></div></header><main><section class="page-title section"><div class="container"><p class="eyebrow centered">Notre sélection</p><h1 class="section-title">Trouvez ce qui vous convient.</h1><div class="catalog-tools"><label class="search-box">⌕ <input id="search" type="search" placeholder="Rechercher un produit…"></label><span id="count"></span></div></div></section><section class="products section"><div class="container"><div class="products-grid" id="grid"></div><p class="empty-products" id="empty" hidden>Aucun produit ne correspond à votre recherche.</p></div></section></main><script>let products=[],whatsappNumber="24370902655";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){const q=search.value.toLowerCase(),list=products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q));count.textContent=list.length+" produit(s)";empty.hidden=!!list.length;grid.innerHTML=list.map(p=>{const msg=encodeURIComponent("Bonjour KWETU COMPANY, je souhaite commander : "+p.name+". Prix indiqué : "+Number(p.price).toFixed(2)+" $. Description : "+p.description+". Merci de me confirmer la disponibilité, les modalités de paiement et de livraison. Cordialement.");return '<article class="product-card">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<div class="product-placeholder">KWETU</div>')+'<span class="availability">● Disponible</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.description)+'</p><p class="price">Prix : '+Number(p.price).toLocaleString("fr-FR",{minimumFractionDigits:2})+' $</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+whatsappNumber+'?text='+msg+'">Commander</a></article>'}).join("")}Promise.all([fetch("/api/products").then(r=>r.json()),fetch("/api/settings").then(r=>r.ok?r.json():{})]).then(([items,settings])=>{products=items;if(/^\d{8,15}$/.test(settings.whatsappNumber))whatsappNumber=settings.whatsappNumber;render()}).catch(()=>grid.innerHTML="<p>Impossible de charger le catalogue.</p>");search.oninput=render;</script></body></html>
