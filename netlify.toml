[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/catalog"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/products"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200
  force = true

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200
  force = true

[[redirects]]
  from = "/api/articles"
  to = "/.netlify/functions/articles"
  status = 200
  force = true

[[redirects]]
  from = "/api/article"
  to = "/.netlify/functions/article"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/articles"
  to = "/.netlify/functions/admin-articles"
  status = 200
  force = true

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/settings"
  to = "/.netlify/functions/admin-settings"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"
